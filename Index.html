<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Puzzle Box 2D - Three.js</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
</head>

<body>

    <div id="game-container"></div>

    <div class="box">

        <h1>🧩 Puzzle Box</h1>

        <!-- START SCREEN -->
        <div id="start-screen">

            <p class="subtitle">
                Selesaikan 20 level acak dan masuk Top 10 Leaderboard!
            </p>

            <input
                type="text"
                id="player-name"
                placeholder="Nama Akun"
                maxlength="20"
            >

            <input
                type="password"
                id="player-password"
                placeholder="Password / PIN Akun"
                maxlength="20"
            >

            <button onclick="startGame()">
                🎮 Mulai Main
            </button>

            <p id="login-message"></p>

        </div>


        <!-- GAME SCREEN -->
        <div id="game-screen" class="hidden">

            <div class="game-info">

                <div class="level-badge">
                    Level
                    <span id="level-num">1</span>
                    / 20
                </div>

                <div class="score-badge">
                    ⭐
                    <span id="score">0</span>
                </div>

            </div>

            <div class="question-box">

                <p id="question" class="question-text">
                    Pertanyaan akan muncul di sini
                </p>

            </div>

            <input
                type="number"
                id="answer"
                placeholder="Masukkan jawaban"
                onkeyup="checkEnter(event)"
            >

            <button onclick="submitAnswer()">
                ✓ Submit Jawaban
            </button>

            <p id="feedback"></p>

        </div>


        <!-- END SCREEN -->
        <div id="end-screen" class="hidden">

            <h2>🎉 Game Selesai!</h2>

            <p class="final-score-text">
                Skor Akhir
            </p>

            <div class="final-score">
                <span id="final-score">0</span>
            </div>

            <button
                id="save-btn"
                onclick="saveScore()"
            >
                🏆 Simpan ke Leaderboard
            </button>

            <button
                class="secondary-button"
                onclick="restartGame()"
            >
                🔄 Main Lagi
            </button>

            <p id="save-message"></p>

        </div>


        <hr>


        <!-- LEADERBOARD -->
        <div class="leaderboard-section">

            <h3>🏆 Top 10 Leaderboard</h3>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Nama</th>
                            <th>Skor</th>
                        </tr>
                    </thead>

                    <tbody id="leaderboard-body">

                        <tr>
                            <td colspan="3">
                                Memuat leaderboard...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <button
                class="refresh-button"
                onclick="loadLeaderboard()"
            >
                🔄 Refresh Leaderboard
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
